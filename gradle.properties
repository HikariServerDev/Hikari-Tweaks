# 17 ターゲットの remapJar を並列実行するとヒープを大量に使う。
# 3G では OOM で落ちるため 6G を確保する（GitHub Actions の標準ランナーは 16GB）。
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ワーカー数を固定してピークメモリを予測可能にする。
# コア数が多いマシンで並列度が上がりすぎて OOM になるのを防ぐ。
org.gradle.workers.max=4

# Mod / 依存バージョンは stonecutter.properties.toml に集約している。
