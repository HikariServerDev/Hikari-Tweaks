name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Modrinth へ上げるタグ（例: v1.2.3）。GitHub Release が作成済みであること'
        required: true
        type: string

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches mod.version
        run: |
          MOD_VERSION="$(grep -oP '^mod\.version\s*=\s*"\K[^"]+' stonecutter.properties.toml)"
          if [ "$MOD_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag=${{ steps.version.outputs.version }} but mod.version=$MOD_VERSION"
            exit 1
          fi

      - name: Build all Minecraft versions
        run: ./gradlew chiseledBuild

      - name: Verify built jars
        run: python scripts/verify-jars.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Hikari-Tweaks v${{ steps.version.outputs.version }}"
          files: build/libs/${{ steps.version.outputs.version }}/*.jar
          generate_release_notes: true

  modrinth-preview:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download jars from the GitHub Release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir jars

      - name: Show what will be uploaded
        run: python scripts/publish-modrinth.py --tag "$TAG" --jar-dir jars --dry-run

  modrinth:
    needs: modrinth-preview
    if: ${{ !failure() && !cancelled() && needs.modrinth-preview.result == 'success' }}
    runs-on: ubuntu-latest
    environment: modrinth
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download jars from the GitHub Release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir jars

      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python scripts/publish-modrinth.py --tag "$TAG" --jar-dir jars
