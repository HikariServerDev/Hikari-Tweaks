name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build all Minecraft versions
        run: ./gradlew chiseledBuild

      - name: Verify built jars
        run: python scripts/verify-jars.py

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-tweaks-build-artifacts
          path: build/libs/*/*.jar
          retention-days: 7
