# Stonecutter 集中プロパティ。
# ここに全ターゲットの依存バージョンを定義する。
# ビルド対象として有効なのは settings.gradle.kts の versions(...) に列挙したものだけ。
# 一覧の根拠と対応範囲は docs/multiversion/PLAN.md §2 を参照。
#
# mod.loader_min : fabric.mod.json の depends.fabricloader の下限。
#   mixins.json の compatibilityLevel を認識できる最小の Fabric Loader を指定する。
#   JAVA_21 を持つ sponge-mixin (0.13.3+mixin.0.8.5) を同梱するのは loader 0.15.10 以降。
#   loader 0.15.9 以前は sponge-mixin 0.12.5 までで JAVA_21 を知らないため、
#   mod.java = "21" のターゲットは 0.15.10 を下限にしないと Mixin の設定ロードが失敗する。
#   JAVA_16 / JAVA_17 は sponge-mixin 0.12.5 でも認識できるので 0.14.0 のままでよい。
#
# mod.malilib_min : fabric.mod.json の depends.malilib の下限。
#   ビルドに使った malilib の「jar 内 fabric.mod.json の version」を採用する。
#   deps.malilib は Maven 座標であって malilib が名乗るバージョンとは限らないので、
#   値を変えるときは必ず実 jar の version と突き合わせること。

mod.id = "hikari-tweaks"
mod.name = "Hikari-Tweaks"
mod.group = "com.hikariserver"
mod.version = "1.0.11"

deps.fabric_loader = "0.17.3"
deps.gson = "2.10.1"

