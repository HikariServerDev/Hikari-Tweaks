mod.mc_compat = "1.17.1"
mod.mc_releases = ["1.17.1"]
mod.java = "16"
mod.loader_min = "0.14.0"
deps.yarn = "1.17.1+build.65"
deps.fabric_api = "0.46.1+1.17"
deps.malilib = "fi.dy.masa.malilib:malilib-fabric-1.17.1:0.10.0-dev.26"
mod.malilib_min = "0.10.0-dev.26"
deps.minihud = "0.20.0-beaconoverlay.1"
deps.modmenu = "2.0.17"

